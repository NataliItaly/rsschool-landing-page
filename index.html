<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon" />
    <title>Coffe House</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="header__nav">
          <div class="header__logo">
            <img
              src="./assets/logo.png"
              alt="Reasorce Coffe House"
              class="header__logo-img"
            />
          </div>
          <ul class="header__menu">
            <li class="header__menu-item">
              <a href="" class="header__link">Favorite coffe</a>
            </li>
            <li class="header__menu-item">
              <a href="" class="header__link">About</a>
            </li>
            <li class="header__menu-item">
              <a href="" class="header__link">Mobile app</a>
            </li>
            <li class="header__menu-item">
              <a href="" class="header__link">Contact us</a>
            </li>
          </ul>
          <div class="header__settings">
            <div class="header__toggle">
              <button
                class="header__toggle-btn header__toggle-light header__toggle-active"
              ></button>
              <button class="header__toggle-btn header__toggle-dark"></button>
            </div>
            <button class="header__menu-btn">Menu</button>
          </div>
        </nav>
      </div>
    </header>
  </body>
</html>
